[package]
name = "scopes-ydin"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
sha2 = "0.10"
tokio-stream = "0.1"
futures = "0.3"

[lib]
name = "scopes_ydin"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "scopes-solmu"
path = "src/main.rs"

[[bin]]
name = "lr-pariteetti"
path = "src/bin/lr-pariteetti.rs"
