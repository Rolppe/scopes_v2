name: ScopesV2
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
packages:
  ScopesCore2:
    path: ../shared/ScopesCore2
  ScopesUI2:
    path: ../shared/ScopesUI2
targets:
  ScopesV2:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources]
    dependencies:
      - package: ScopesCore2
      - package: ScopesUI2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scopes-v2
    scheme:
      testTargets: [ScopesV2UITests]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: scopes-V2
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: scopes-V2 käyttää omaa solmuaan laitteella.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ScopesV2UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests]
    dependencies:
      - target: ScopesV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scopes-v2.uitests
        GENERATE_INFOPLIST_FILE: YES
